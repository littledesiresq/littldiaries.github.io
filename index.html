<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Homepage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #222;
        }

        /* Venster bovenin */
        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            color: #2563eb;
        }

        /* Inhoud */
        main {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #666;
        }

        .knop {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .knop:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Mijn Website</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Over mij</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welkom op mijn homepage!</h1>
        <p>Dit is mijn nieuwe website.</p>

        <a href="#" class="knop">Lees meer</a>
    </main>

</body>
</html>
